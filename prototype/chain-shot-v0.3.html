const params=new URLSearchParams(location.search),debug=params.get('debug')==='1';
let mode=params.get('mode')==='blast'?'blast':'classic',theme=['minimal','direction','palette'].includes(params.get('theme'))?params.get('theme'):'minimal',muted=false,voices=0,master=null,noise=null,compressor=null;

function levelSet(){return LEVELS}
function applyMode(){document.body.classList.add('polish');document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));demoBtn.hidden=!debug;document.querySelector('.controls').classList.toggle('debug',debug);document.getElementById('debugInfo').hidden=!debug;resetLevel()}
function graphClosure(level,seed){const seen=new Set([seed]),queue=[seed];for(const i of queue){const a=level.nodes[i],d=DIRS[a.dir];level.nodes.forEach((b,j)=>{const x=b.x-a.x,y=b.y-a.y,t=d.dx?x/d.dx:y/d.dy;if(t>0&&x===d.dx*t&&y===d.dy*t&&!seen.has(j)){seen.add(j);queue.push(j)}})}return [...seen].sort((a,b)=>a-b)}
let cssW=0,cssH=0,dpr=1,currentLevel=0,nodes=[],pulses=[],rings=[],particles=[],running=false,result=null,activatedCount=0,combo=0,accumulator=0,lastTime=performance.now(),resultAt=0,shake=0,demoTimer=0,audioCtx=null;

}

function nodeColor(node){if(theme==='direction'){return {U:'#3975a7',D:'#3975a7',L:'#b96e32',R:'#b96e32',UL:'#408667',DR:'#408667',UR:'#8765a9',DL:'#8765a9'}[node.dir]}if(theme==='palette')return levelSet()[currentLevel].name==='爱心'?'#b66c83':levelSet()[currentLevel].name==='房屋'?'#ad8150':levelSet()[currentLevel].name==='闪电'?'#ac8732':['#408667','#3975a7','#8765a9'][currentLevel%3];return '#408667'}
function drawPulses(phase){ctx.save();ctx.lineCap='round';for(const p of pulses){if(p.waiting)continue;const b=gridToScreen(p.x+p.dx*phase,p.y+p.dy*phase),a=gridToScreen(p.x+p.dx*(Math.max(0,phase-.65)),p.y+p.dy*(Math.max(0,phase-.65)));const color=nodeColor(nodes[p.source]),g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);g.addColorStop(0,color+'00');g.addColorStop(1,color);ctx.strokeStyle=g;ctx.lineWidth=4+Math.min(2,p.depth*.25);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.shadowColor=color;ctx.shadowBlur=7;ctx.fillStyle=color;ctx.beginPath();ctx.arc(b.x,b.y,3.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,1.3,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawFx(dt){const b=boardMetrics();for(const ring of rings){ring.life-=dt/420;if(ring.life<=0)continue;const p=gridToScreen(ring.x,ring.y),t=1-ring.life,ease=1-(1-t)**3;ctx.save();ctx.globalAlpha=ring.life*.55;ctx.strokeStyle=ring.color;ctx.lineWidth=2*ring.life+.4;ctx.beginPath();ctx.arc(p.x,p.y,b.nodeR+ease*(18+ring.strong*12),0,Math.PI*2);ctx.stroke();ctx.restore()}rings=rings.filter(r=>r.life>0);for(const part of particles){part.life-=dt/380;part.x+=part.vx*dt/1000;part.y+=part.vy*dt/1000;part.vx*=Math.exp(-dt/170);part.vy*=Math.exp(-dt/170);if(part.life<=0)continue;const p=gridToScreen(part.x,part.y);ctx.save();ctx.globalAlpha=part.life*.8;ctx.translate(p.x,p.y);ctx.rotate(part.spin+(1-part.life)*2);ctx.fillStyle=part.color;ctx.fillRect(-2,-1,4*part.life,2*part.life);ctx.restore()}particles=particles.filter(p=>p.life>0)}
function drawNodes(now){const b=boardMetrics();for(const n of nodes){const p=gridToScreen(n.x,n.y),age=n.active?now-n.activatedAt:Infinity,color=nodeColor(n);ctx.save();ctx.translate(p.x,p.y);
 if(mode==='blast'&&n.active&&n.fired&&age>200){ctx.globalAlpha=.2;ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,b.nodeR*.65,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-3,0);ctx.lineTo(3,0);ctx.stroke();ctx.restore();continue}
 let pop=1;if(age<100&&n.seed)pop=1-.15*Math.sin(age/100*Math.PI/2);else if(age<360)pop=1+.22*Math.exp(-age/150)*Math.sin(age/45);
 if(mode==='blast'&&n.active&&n.fired){if(age<240){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.globalAlpha=Math.max(0,1-age/240);for(let k=0;k<3;k++){const a=k*Math.PI*2/3,dist=(age/240)**.6*20;ctx.save();ctx.translate(Math.cos(a)*dist,Math.sin(a)*dist);ctx.rotate(a+age/150);ctx.beginPath();ctx.moveTo(-5,-2);ctx.lineTo(4,0);ctx.lineTo(0,5);ctx.stroke();ctx.restore()}ctx.restore()}const fade=Math.max(0,1-(age-88)/150);ctx.globalAlpha=fade;pop*=1+(1-fade)*.3}
 const r=b.nodeR*pop;ctx.shadowColor='#253b3215';ctx.shadowBlur=4;ctx.shadowOffsetY=2;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle=n.active?color+'35':'#f3f0e8';ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.strokeStyle=n.active?color:'#d5d9cf';ctx.lineWidth=n.active?2:1.2;ctx.stroke();ctx.beginPath();ctx.arc(0,0,r-3,Math.PI,Math.PI*1.8);ctx.strokeStyle='#ffffffbb';ctx.stroke();
 if(result==='fail'&&!n.active){ctx.globalAlpha=.5+.2*Math.sin(now/320);ctx.strokeStyle='#b78b63';ctx.beginPath();ctx.arc(0,0,r+3,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
 if(age<65&&!n.seed){ctx.fillStyle='#ffffffcc';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill()}
 const d=DIRS[n.dir];ctx.rotate(Math.atan2(d.dy,d.dx));ctx.strokeStyle=theme==='direction'?color:'#253b32';ctx.lineWidth=2.8;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(9,0);ctx.moveTo(3,-6);ctx.lineTo(9,0);ctx.lineTo(3,6);ctx.stroke();ctx.restore();if(debug){ctx.fillStyle='#65716a';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText(n.index,p.x,p.y-28)}}}
function drawResult(now){if(result!=='success')return;const age=now-resultAt;if(age>650)return;ctx.save();ctx.globalAlpha=.22*(1-age/650);for(const n of nodes){const p=gridToScreen(n.x,n.y);ctx.strokeStyle=nodeColor(n);ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,boardMetrics().nodeR+8+age/35,0,Math.PI*2);ctx.stroke()}ctx.restore()}

function draw(dt,phase,now){ctx.clearRect(0,0,cssW,cssH);const shakeNow=Math.max(0,shake);if(shake>0)shake=Math.max(0,shake-dt*.018);ctx.save();if(shakeNow>.05)ctx.translate((Math.random()-.5)*shakeNow,(Math.random()-.5)*shakeNow);drawPulses(phase);drawFx(dt);drawNodes(now);drawResult(now);ctx.restore();if(result==="success"){const age=now-resultAt;if(age<300){ctx.fillStyle=`rgba(197,244,255,${(1-age/300)*.11})`;ctx.fillRect(0,0,cssW,cssH)}}}
function frame(now){if(document.hidden){lastTime=now;requestAnimationFrame(frame);return}let dt=now-lastTime;lastTime=now;dt=Math.min(dt,50);if(running){accumulator+=dt;while(accumulator>=STEP_MS){stepSimulation();accumulator-=STEP_MS}}else accumulator=0;draw(dt,running?accumulator/STEP_MS:0,now);requestAnimationFrame(frame)}
function pointerPosition(ev){const rect=canvas.getBoundingClientRect();return{x:ev.clientX-rect.left,y:ev.clientY-rect.top}}
function findNodeAt(px,py){const b=boardMetrics();let best=-1,bestDist=Infinity;for(let i=0;i<nodes.length;i++){const p=gridToScreen(nodes[i].x,nodes[i].y),d=Math.hypot(px-p.x,py-p.y);if(d<Math.max(30,b.nodeR*1.35)&&d<bestDist){bestDist=d;best=i}}return best}
canvas.addEventListener("pointerdown",ev=>{if(running||result)return;const p=pointerPosition(ev),index=findNodeAt(p.x,p.y);if(index>=0)startAttempt(index)});
restartBtn.addEventListener("click",()=>{ensureAudio();sound('ui');resetLevel()});
demoBtn.addEventListener("click",()=>{ensureAudio();sound('ui');resetLevel();message.textContent="自动演示正确 Seed…";demoTimer=setTimeout(()=>startAttempt(levelSet()[currentLevel].solution),420)});
nextBtn.addEventListener("click",()=>{if(result!=="success")return;sound('ui');currentLevel=(currentLevel+1)%levelSet().length;resetLevel()});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{ensureAudio();sound('ui');mode=b.dataset.mode;const u=new URL(location.href);u.searchParams.set('mode',mode);history.replaceState(null,'',u);applyMode()}));
const muteBtn=document.getElementById('muteBtn');function syncMute(){if(master){master.gain.cancelScheduledValues(audioCtx.currentTime);master.gain.value=muted?0:.65};muteBtn.textContent=muted?'声音：关':'声音：开';muteBtn.setAttribute('aria-pressed',muted)}
muteBtn.addEventListener('click',()=>{muted=!muted;try{localStorage.setItem('chain-shot-muted',muted?'1':'0')}catch(e){}ensureAudio();syncMute()});syncMute();
if(debug)window.chainShot={get levels(){return levelSet()},get state(){return {audioState:audioCtx?audioCtx.state:null,mode,theme,voices,muted,masterGain:master?master.gain.value:null,rings:rings.length,particles:particles.length,running,result,activatedCount,pulses:pulses.length,active:nodes.filter(n=>n.active).map(n=>n.index)}},start:startAttempt,step:stepSimulation,reset:resetLevel,closure:graphClosure,setLevel(i){currentLevel=i;resetLevel()},setMode(m){mode=m;applyMode()},setTheme(t){theme=t;themeSelect.value=t;resetLevel()},point(i){return gridToScreen(nodes[i].x,nodes[i].y)}};
const themeSelect=document.getElementById('themeSelect');themeSelect.value=theme;themeSelect.addEventListener('change',()=>{theme=themeSelect.value;ensureAudio();sound('ui');resetLevel();const u=new URL(location.href);u.searchParams.set('theme',theme);history.replaceState(null,'',u)});
document.addEventListener('visibilitychange',()=>{lastTime=performance.now();if(audioCtx){if(document.hidden)audioCtx.suspend().catch(()=>{});else if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{})}});
window.addEventListener("resize",resize);
resize();applyMode();requestAnimationFrame(frame);
})();
</script>
</body>
